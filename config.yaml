# Default configuration template for Multilingual JEPA training

# Model configuration
model:
  encoder_name: "bert-base-multilingual-cased"
  pooling: "cls"  # cls, mean, or attention
  num_languages: 9
  tau: 0.999  # EMA decay rate

# Dataset configuration (WMT19 only)
data:
  lang_pair: "en-de"  # Language pair (e.g., en-de, cs-en, fr-de)
  batch_size: 8
  num_workers: 0

# Training configuration
training:
  epochs: 1
  learning_rate: 1e-4
  max_grad_norm: 1.0
  log_interval: 100

# Output configuration
output:
  save_dir: "./checkpoints"  # Or "./experiments/exp_001_wmt19_en_de"
  device: "cuda"  # auto-detected if "cuda"


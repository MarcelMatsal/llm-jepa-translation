# Test experiment configuration

# Model configuration
model:
  encoder_name: "bert-base-multilingual-cased"
  pooling: "cls"  # cls, mean, or attention
  num_languages: 9
  tau: 0.999  # EMA decay rate

# Dataset configuration (WMT19 only)
data:
  lang_pair: "lt-en"  # Language pair for testing
  batch_size: 4  # Small batch for testing
  num_workers: 0

# Training configuration
training:
  epochs: 1  # Single epoch for quick test
  learning_rate: 1e-4
  max_grad_norm: 1.0
  log_interval: 10  # More frequent logging for testing

# Output configuration
output:
  save_dir: "./experiments/exp_test"
  device: "cuda"  # auto-detected if "cuda"


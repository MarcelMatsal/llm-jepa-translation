# OPUS-100 Dataset Configuration Example
# Demonstrates how to select specific language pairs and control dataset size

# Experiment metadata
experiment_name: "opus100-multilingual"
description: "Training with OPUS-100 dataset - multiple language pairs with configurable sizes"

# Model configuration
model:
  base_model: "xlm-roberta-base"  # Pre-trained XLM-RoBERTa
  lambda_alignment: 1.0  # Weight for alignment loss
  alignment_loss_type: "cosine"  # Options: 'mse', 'cosine', 'contrastive'
  mlm_probability: 0.15  # Masking probability for standard MLM

# Dataset configuration - OPUS-100
data:
  # Language pairs to train on - you can hand-select any pairs from OPUS-100
  # OPUS-100 supports 100+ language pairs (all with English)
  # See: https://huggingface.co/datasets/Helsinki-NLP/opus-100
  # 
  # Examples of available pairs:
  # European: de-en, fr-en, es-en, it-en, pt-en, nl-en, sv-en, da-en, etc.
  # Asian: ja-en, zh-en, ko-en, th-en, vi-en, hi-en, etc.
  # Others: ar-en, ru-en, tr-en, fa-en, he-en, etc.
  lang_pairs: 
    - "de-en"      # German-English (1M examples available)
    - "fr-en"      # French-English (1M examples available)
    - "en-es"      # English-Spanish (1M examples available)
    - "en-ja"      # English-Japanese (1M examples available)
    - "ar-en"      # Arabic-English (1M examples available)
  
  batch_size: 16  # Batch size for training
  max_length: 256  # Maximum sequence length after tokenization
  num_workers: 4  # DataLoader workers
  
  # Maximum examples to load per language pair
  # The actual number loaded will be: min(max_examples_per_pair, total_available)
  # Set to null to load all available examples for each pair
  # 
  # OPUS-100 has different amounts per pair:
  # - Large pairs (de-en, fr-en, es-en, etc.): ~1M examples
  # - Medium pairs: 100k-1M examples
  # - Small pairs: 10k-100k examples
  max_examples_per_pair: 50000  # Load max 50k examples per pair
  
  # Text filtering (applied BEFORE counting towards max_examples_per_pair)
  min_text_length: 10   # Minimum characters per text
  max_text_length: 500  # Maximum characters per text

# Training configuration
training:
  epochs: 5
  learning_rate: 0.00002  # 2e-5
  weight_decay: 0.01
  warmup_steps: 500
  max_grad_norm: 1.0
  log_interval: 100
  save_every: 1  # Save checkpoint every N epochs
  accumulation_steps: 1

# Output configuration
output:
  save_dir: "./experiments/exp_test/checkpoints_opus100"
  device: "cuda"  # 'cuda' or 'cpu'
  hub_model_base: "maktzgls/bert-jepa"
  push_to_hub: false  # Set to true to push to HuggingFace Hub

# Evaluation configuration
evaluation:
  eval_lang_pairs: ["de-en", "fr-en", "en-es"]
  eval_batch_size: 32
  num_eval_batches: 10
  retrieval_top_k: [1, 5, 10]

# Weights & Biases configuration
wandb:
  enabled: true
  entity: "makt_zgls"
  project: "llm-jepa-translation"
  run_name: "opus100-5lang-50k"
  tags: ["opus-100", "xlm-roberta-base", "multilingual", "5-languages"]
  notes: "Training with OPUS-100: 5 diverse language pairs, 50k examples each"


# Dual-Objective BERT Training Configuration - SMALL TEST
# This is a smaller configuration for quick iteration and testing

# Model configuration
model:
  base_model: "xlm-roberta-base"  # Pre-trained XLM-RoBERTa
  lambda_alignment: 1.0  # Weight for alignment loss
  alignment_loss_type: "mse"  # Options: 'mse', 'cosine', 'contrastive'
  mlm_probability: 0.15  # Masking probability for standard MLM

# Dataset configuration
data:
  lang_pairs: ["de-en"]  # Single language pair for faster testing
  batch_size: 8  # Smaller batch size
  max_length: 128  # Shorter sequences for faster processing
  num_workers: 4  # DataLoader workers
  max_examples_per_pair: 1000  # Limit to 1000 examples per pair
  min_text_length: 10  # Minimum text length (characters)
  max_text_length: 200  # Maximum text length (characters)

# Training configuration
training:
  epochs: 2  # Just 2 epochs for testing
  learning_rate: 0.00002  # Initial learning rate (2e-5)
  weight_decay: 0.01  # AdamW weight decay
  warmup_steps: 100  # Fewer warmup steps
  max_grad_norm: 1.0  # Gradient clipping norm
  log_interval: 50  # Log more frequently
  save_every: 1  # Save checkpoint every epoch
  accumulation_steps: 2  # Gradient accumulation (effective batch = 8 * 2 = 16)

# Output configuration
output:
  save_dir: "./experiments/exp_test/checkpoints_small"
  device: "cuda"  # 'cuda' or 'cpu'

# Evaluation configuration (optional)
evaluation:
  eval_lang_pairs: ["de-en"]
  eval_batch_size: 16
  num_eval_batches: 5
  retrieval_top_k: [1, 5, 10]

# Weights & Biases configuration
wandb:
  enabled: true
  entity: "makt_zgls"
  project: "llm-jepa-translation"
  run_name: "test-run-small"
  tags: ["xlm-roberta-base", "dual-objective", "de-en", "test"]
  notes: "Small test run for validation"


# FLORES Training Configuration - 15 Language Pairs with InfoNCE (Monolingual MLM)
# Using InfoNCE (Information Noise-Contrastive Estimation) for alignment
# Using Monolingual MLM strategy (concatenated sequences)
# Dataset: Facebook FLORES (high-quality, smaller dataset)

# Experiment metadata
experiment_name: "flores-15lang-infonce-monolingual"
description: "Training with 15 diverse language pairs using InfoNCE contrastive loss, Monolingual MLM strategy, and FLORES dataset"

# Model configuration
model:
  base_model: "xlm-roberta-base"  # Pre-trained XLM-RoBERTa
  lambda_alignment: 1.0  # Weight for alignment loss vs MLM
  
  # InfoNCE alignment loss configuration
  alignment_loss:
    type: "infonce"  # Information Noise-Contrastive Estimation
    
    # InfoNCE-specific parameters
    temperature: 0.07        # Temperature scaling (lower = harder negatives)
    normalize: true          # L2 normalize embeddings (for cosine similarity)
    use_projector: false     # Optional MLP projector (+20% performance boost)
    
    # Projector parameters (if use_projector=true)
    projector_hidden_dim: 2048   # Hidden layer dimension
    projector_output_dim: 128    # Projection space dimension
    projector_num_layers: 2      # Number of layers (2 or 3)
  
  mlm_probability: 0.15  # Masking probability for standard MLM
  
  # MLM Strategy
  # 'monolingual': Mask each language separately (matches inference, cleaner separation)
  # 'bilingual': Mask both languages together (XLM-TLM style, more alignment signal)
  mlm_strategy: "monolingual"

# Dataset configuration - Facebook FLORES
data:
  # Dataset source: 'flores' or 'opus100'
  dataset_source: "flores"
  
  # FLORES data is loaded completely and split into train/validation/test
  # matching OPUS-100 style: 80% train, 10% validation, 10% test
  # Use 'train', 'validation', 'test', or 'all'
  train_split: "train"       # 80% of data (~1607 examples per pair)
  val_split: "validation"    # 10% of data (~201 examples per pair)
  
  lang_pairs: 
    - "de-en"      # German-English
    - "en-fr"      # French-English
    - "en-es"      # Spanish-English
    - "el-en"      # Greek-English
    - "bg-en"      # Bulgarian-English
    - "en-ru"      # Russian-English
    - "en-tr"      # Turkish-English
    - "ar-en"      # Arabic-English
    - "en-vi"      # Vietnamese-English
    - "en-th"      # Thai-English
    - "en-zh"      # Chinese-English
    - "en-hi"      # Hindi-English
    - "en-sw"      # Swahili-English
    - "en-ur"      # Urdu-English

  batch_size: 16  # Batch size (GPU memory constraint)
  max_length: 128  # Maximum sequence length after tokenization
  num_workers: 4  # DataLoader workers
  
  # FLORES is smaller, so load all available examples per pair (~2009 max)
  # Set to null to load all available examples
  max_examples_per_pair: null
  
  # Text filtering (applied BEFORE counting towards max_examples_per_pair)
  min_text_length: 10   # Minimum characters per text
  max_text_length: 500  # Maximum characters per text

# Training configuration
# Note: FLORES is much smaller than OPUS-100, so we train for more epochs
training:
  epochs: 50  # More epochs since dataset is smaller (~28k total examples)
  learning_rate: 0.00002  # 2e-5, standard for fine-tuning
  weight_decay: 0.01  # AdamW weight decay
  warmup_steps: 200  # Linear warmup steps (reduced for smaller dataset)
  max_grad_norm: 1.0  # Gradient clipping norm
  log_interval: 50  # Log every 50 steps (more frequent for smaller dataset)
  save_every: 10  # Save checkpoint every 10 epochs
  accumulation_steps: 4  # Accumulate 4 steps = effective batch size 64

# Output configuration
output:
  save_dir: "./experiments/flores_15lang_infonce_monolingual/checkpoints"
  device: "cuda"  # 'cuda' or 'cpu'
  hub_model_base: "maktzgls/bert-jepa-infonce-monolingual-15lang-flores"  # HuggingFace Hub model name base
  push_to_hub: true  # Set to true to push to HuggingFace Hub

# Evaluation configuration
evaluation:
  eval_lang_pairs: ["de-en", "en-fr", "en-es", "el-en", "bg-en", "en-ru", "en-tr", "ar-en", "en-vi", "en-th", "en-zh", "en-hi", "en-sw", "en-ur"]
  eval_batch_size: 64
  num_eval_batches: 10
  retrieval_top_k: [1, 5, 10]

# Weights & Biases configuration
wandb:
  enabled: true
  entity: "makt_zgls"
  project: "llm-jepa-translation"
  run_name: "flores-15lang-infonce-monolingual"
  tags: ["flores", "xlm-roberta-base", "15-languages", "infonce", "contrastive", "monolingual-mlm"]
  notes: "Training with FLORES dataset: 15 diverse language pairs using InfoNCE contrastive loss and Monolingual MLM strategy. FLORES provides high-quality parallel sentences."

